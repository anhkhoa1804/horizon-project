# ISOLATED local Supabase-compatible stack for staging tests. Binds to 127.0.0.1 only.
name: horizon-local
services:
  db:
    image: supabase/postgres:15.8.1.085
    ports: ["127.0.0.1:54322:5432"]
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", JWT_SECRET: "${JWT_SECRET}" }
    healthcheck: { test: ["CMD","pg_isready","-U","postgres","-h","localhost"], interval: 3s, retries: 40 }
  auth:
    image: supabase/gotrue:v2.164.0
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:3100
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: "1000"
  storage:
    image: supabase/storage-api:v1.11.13
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["storage-data:/var/lib/storage"]
  functions:
    image: supabase/edge-runtime:v1.65.3
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      VERIFY_JWT: "false"
      GATEWAY_INGEST_TOKEN: ${GATEWAY_INGEST_TOKEN}
    volumes: ["./.functions-local:/home/deno/functions:ro"]
    command: ["start","--main-service","/home/deno/functions/edge-ingest"]
  gateway:
    image: nginx:1.27-alpine
    depends_on: [rest, auth, storage]
    ports: ["127.0.0.1:54321:8000"]
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
volumes: { storage-data: {} }

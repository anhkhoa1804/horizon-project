; Compile exactly one physical node; explicit C++ entry points avoid .ino merging.
[platformio]
default_envs = station1, station2, gateway
src_dir = build_entries
[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
extra_scripts = pre:tools/prepare_sources.py
lib_deps = bblanchon/ArduinoJson@7.4.2
[env:station1]
build_flags = ${env.build_flags} -DHORIZON_STATION_BUILD_01=1
build_src_filter = +<station1.cpp>
[env:station2]
build_flags = ${env.build_flags} -DHORIZON_STATION_BUILD_02=1
build_src_filter = +<station2.cpp>
[env:gateway]
build_src_filter = +<gateway.cpp>
